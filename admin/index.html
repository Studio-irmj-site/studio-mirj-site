<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Studio I.R — Administração</title>
  <link rel="stylesheet" href="admin.css?v=9">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="../supabase-config.js?v=6"></script>
</head>
<body>
  <div id="app">
    <section id="login" class="login">
      <div class="login-card">
        <div class="logo">I.R</div>
        <p class="eyebrow">STUDIO I.R</p>
        <h1>Painel Administrativo</h1>
        <p>Entre para gerenciar o site do Studio.</p>
        <form id="loginForm">
          <label>E-mail<input id="email" type="email" required autocomplete="email"></label>
          <label>Senha<input id="password" type="password" required autocomplete="current-password"></label>
          <button class="primary" type="submit">Entrar no painel</button>
          <p id="loginError" class="error"></p>
        </form>
      </div>
    </section>

    <section id="panel" class="panel hidden">
      <aside>
        <div class="brand">
          <div class="logo mini">I.R</div>
          <div><strong>Studio I.R</strong><small>Administração</small></div>
        </div>
        <button class="nav active" data-view="dashboard" title="Dashboard">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"></rect><rect x="14" y="3" width="7" height="7" rx="2"></rect><rect x="3" y="14" width="7" height="7" rx="2"></rect><rect x="14" y="14" width="7" height="7" rx="2"></rect></svg>
          <span>Dashboard</span>
        </button>
        <button class="nav" data-view="services" title="Serviços">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 1.25 3.75L17 8l-3.75 1.25L12 13l-1.25-3.75L7 8l3.75-1.25L12 3Z"></path><path d="m5 14 .85 2.15L8 17l-2.15.85L5 20l-.85-2.15L2 17l2.15-.85L5 14Z"></path><path d="m19 13 .85 2.15L22 16l-2.15.85L19 19l-.85-2.15L16 16l2.15-.85L19 13Z"></path></svg>
          <span>Serviços</span>
        </button>
        <button class="nav" data-view="appointments" title="Agenda">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M16 3v4M8 3v4M3 10h18"></path><path d="m9 15 2 2 4-4"></path></svg>
          <span>Agenda</span>
        </button>
        <button class="nav" data-view="availability" title="Disponibilidade">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path><path d="M7 2v3M17 2v3"></path></svg>
          <span>Disponibilidade</span>
        </button>
        <button class="nav" data-view="clients" title="Clientes">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          <span>Clientes</span>
        </button>
        <button class="nav" data-view="attendances" title="Atendimentos">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M9 3.5h6V7H9zM9 13l2 2 4-4"></path></svg>
          <span>Atendimentos</span>
        </button>
        <button class="nav" data-view="settings" title="Configurações">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21H9.6v-.1A1.7 1.7 0 0 0 8.55 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.2 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H2.4V9.6h.1A1.7 1.7 0 0 0 4.2 8.55a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 8.55 4.2a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V2.4h4.1v.1a1.7 1.7 0 0 0 1.05 1.7 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 8.55a1.7 1.7 0 0 0 .6 1 1.7 1.7 0 0 0 1.1.4h.1v4.1h-.1A1.7 1.7 0 0 0 19.4 15Z"></path></svg>
          <span>Configurações</span>
        </button>
        <button id="logout" class="logout" title="Sair do painel">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3"></path><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path></svg>
          <span>Sair</span>
        </button>
      </aside>
      <main>
        <header>
          <div><p class="eyebrow">STUDIO I.R</p><h2 id="title">Dashboard</h2></div>
          <a href="../" target="_blank">Ver site ↗</a>
        </header>
        <div id="content"></div>
      </main>
    </section>
  </div>

  <script src="admin.js?v=6"></script>
  <script src="receipts.js?v=1"></script>
  <script src="dashboard-revenue.js?v=4"></script>
  <script src="dashboard-finance.js?v=1"></script>
  <script src="clients.js?v=2"></script>
  <script src="clients-route.js?v=2"></script>
  <script src="appointment-client-picker.js?v=2"></script>
  <script src="appointment-attendance-bridge.js?v=1"></script>
  <script src="appointment-conflict-guard.js?v=2"></script>
  <script src="appointment-requests.js?v=1"></script>
  <script src="finance.js?v=3"></script>
  <script src="finance-route.js?v=1"></script>
  <script src="availability.js?v=2"></script>
  <script src="availability-route.js?v=1"></script>
  <script src="appointment-availability-sync.js?v=1"></script>
</body>
</html>
